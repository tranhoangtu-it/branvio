[workspace]
resolver = "3"
members = [
    "crates/branvio-core",
    "crates/git-engine",
    "crates/graph-layout",
    "crates/diff-merge",
    "crates/oplog-undo",
    "crates/fs-watcher",
    "crates/terminal-pty",
    "crates/forge-client",
    "crates/ai-copilot",
    "crates/app-ui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tranhoangtu-it/branvio"
authors = ["Branvio Contributors"]

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
todo = "deny"
unimplemented = "deny"

[workspace.dependencies]
# Internal workspace crates
branvio-core = { path = "crates/branvio-core" }
git-engine = { path = "crates/git-engine" }
graph-layout = { path = "crates/graph-layout" }
diff-merge = { path = "crates/diff-merge" }
oplog-undo = { path = "crates/oplog-undo" }
fs-watcher = { path = "crates/fs-watcher" }
terminal-pty = { path = "crates/terminal-pty" }
forge-client = { path = "crates/forge-client" }
ai-copilot = { path = "crates/ai-copilot" }

# Tier 1 & Tier 2 Git libraries
# Note: gix handles high-speed async/parallel read, revwalk, blame, status, and ODB traversal.
# Note: git2 uses default-features = false (no libssh2/openssl) so pkg-config is not needed
# and Tier 2 strictly stays in-memory/local index without touching SSH/HTTPS transports.
gix = { version = "0.90.0", default-features = false, features = [
    "max-performance",
    "basic",
    "status",
    "blame",
    "mailmap",
    "excludes",
    "attributes",
    "merge",
    "sha1",
    "sha256",
    "serde",
] }
git2 = { version = "0.21.0", default-features = false }

# Diff, Rope text buffer, and AST syntax highlighting
imara-diff = "0.2.0"
# Disable default `unicode_lines` / `cr_lines` so Rope splits strictly on `\n` (0x0A),
# matching Git and diff-merge line indexing on bare `\r`, `\x0B`, `\x0C`, U+0085, U+2028, U+2029.
ropey = { version = "1.6.1", default-features = false, features = ["simd"] }
tree-sitter = "0.27.2"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
tree-sitter-python = "0.25.0"
tree-sitter-json = "0.24.8"

# Filesystem watcher & .gitignore filtering
notify = "8.2.2"
notify-debouncer-full = "0.7.0"
ignore = "0.4.34"

# Integrated cross-platform terminal
portable-pty = "0.9.0"
alacritty_terminal = "0.26.0"

# Embedded transactional storage & OS keychain
redb = "5.0.0"
keyring = "4.2.0"

# Fuzzy matching for Command Palette
nucleo = "0.5.0"
nucleo-matcher = "0.3.1"

# GPU-accelerated UI layer (strictly isolated in crates/app-ui)
# `runtime_shaders` compiles Metal shaders at startup via Metal.framework so local dev & CI
# builds on macOS do not require downloading Xcode's standalone MetalToolchain component.
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
wgpu = "30.0.2"

# Windows-only build-time resource compiler driver (embeds the .exe icon + VERSIONINFO).
# Default `toml` feature disabled: metadata is set explicitly in crates/app-ui/build.rs, so the
# only transitive dependency is `version_check`.
winresource = { version = "0.1.34", default-features = false }

# Async runtime & networking
tokio = { version = "1.54.1", features = [
    "rt-multi-thread",
    "process",
    "io-util",
    "sync",
    "time",
    "fs",
    "macros",
    "parking_lot",
] }
reqwest = { version = "0.13.5", features = ["json", "stream", "gzip"] }
futures = "0.3.34"
async-trait = "0.1.92"

# Lock-free / compact data structures & OS path normalization
parking_lot = "0.13.0"
crossbeam-channel = "0.5.17"
arc-swap = "1.9.5"
dashmap = "6.2.1"
smallvec = { version = "1.16.6", features = ["const_generics", "const_new", "union", "serde"] }
compact_str = { version = "0.10.0", features = ["serde"] }
bitflags = { version = "2.13.2", features = ["serde"] }
bstr = { version = "1.14.0", features = ["serde"] }
dunce = "1.0.5"
tempfile = "3.27.0"

# Serialization, error handling, and telemetry
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

[profile.dev]
opt-level = 0
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
