<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Branvio — Command palette (dark)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;500&amp;family=Atkinson+Hyperlegible+Next:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;color-scheme:dark;background:#0F141A;color:#E6EBF0;font-family:'Atkinson Hyperlegible Next',system-ui,sans-serif;font-size:14px;line-height:1.4}
a{color:#7AA7F5}a:hover{color:#A9C6F8}
.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.mono{font-family:'Atkinson Hyperlegible Mono',ui-monospace,monospace}
.grp{margin:10px 16px 4px;font-size:12px;color:#9AA7B5}
.it{display:flex;align-items:center;gap:12px;width:100%;box-sizing:border-box;padding:9px 16px;border:0;background:transparent;font:inherit;font-size:14px;color:#E6EBF0;text-align:left;cursor:pointer}
.it:hover,.it.on{background:#18263A}
.it:focus-visible{outline:2px solid #2F6FE0;outline-offset:-2px}
.it small{color:#9AA7B5;font-size:12px;margin-left:6px}
.kb{margin-left:auto;display:flex;gap:4px}
.kb span{min-width:20px;height:22px;padding:0 5px;box-sizing:border-box;display:grid;place-items:center;border:1px solid #2A333E;border-radius:5px;background:#161C24;font-size:12px;color:#B6C2CE}
.danger{color:#F87171}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; display: flex; justify-content: center; padding-top: 96px; background: #070A0E">

  <div role="dialog" aria-label="Command palette" style="width: 680px; height: max-content; background: #161C24; border: 1px solid #2A333E; border-radius: 14px; box-shadow: 0 24px 60px rgba(24,33,43,0.28); overflow: hidden">
    <label style="display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid #1F262F">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 18px; height: 18px; color: #9AA7B5"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search commands</span>
      <input type="text" value="push" style="flex: 1; border: 0; outline: none; font: inherit; font-size: 17px; color: #E6EBF0; background: transparent">
      <span style="font-size: 12px; color: #9AA7B5">11 results</span>
    </label>

    <div style="padding-bottom: 8px">
      <div class="grp">Push</div>
      <button class="it on" type="button"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m18 9-6-6-6 6"></path><path d="M12 3v14"></path><path d="M5 21h14"></path></svg>Push to origin/feat/ai-redaction<small>2 commits</small><span class="kb"><span>⌘</span><span>P</span></span></button>
      <button class="it" type="button"><span style="width: 16px"></span>Push and set upstream…</button>
      <button class="it" type="button"><span style="width: 16px"></span>Push to another remote…</button>
      <button class="it" type="button"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="color: #FBBF24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"></path></svg>Force push safely<small>with lease</small></button>
      <button class="it danger" type="button"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><line x1="12" x2="12" y1="8" y2="12"></line><line x1="12" x2="12.01" y1="16" y2="16"></line></svg>Force push…</button>
      <button class="it" type="button"><span style="width: 16px"></span>Push tag…</button>
      <button class="it" type="button"><span style="width: 16px"></span>Push all tags</button>
      <button class="it danger" type="button"><span style="width: 16px"></span>Delete branch on remote…</button>

      <div class="grp">Branches</div>
      <button class="it" type="button"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="color: #38BDF8"><line x1="6" x2="6" y1="3" y2="15"></line><circle cx="18" cy="6" r="3"></circle><circle cx="6" cy="18" r="3"></circle><path d="M18 9a9 9 0 0 1-9 9"></path></svg>Push main<small>1 commit ahead of origin</small></button>

      <div class="grp">Settings</div>
      <button class="it" type="button"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><line x1="21" x2="14" y1="4" y2="4"></line><line x1="10" x2="3" y1="4" y2="4"></line><line x1="21" x2="12" y1="12" y2="12"></line><line x1="8" x2="3" y1="12" y2="12"></line><line x1="21" x2="16" y1="20" y2="20"></line><line x1="12" x2="3" y1="20" y2="20"></line><line x1="14" x2="14" y1="2" y2="6"></line><line x1="8" x2="8" y1="10" y2="14"></line><line x1="16" x2="16" y1="18" y2="22"></line></svg>Default push behavior</button>
      <button class="it" type="button"><span style="width: 16px"></span>Push tags with commits automatically</button>
    </div>

    <div style="display: flex; gap: 18px; padding: 10px 16px; border-top: 1px solid #1F262F; background: #131920; font-size: 12px; color: #9AA7B5">
      <span><span class="mono">↑↓</span> move</span>
      <span><span class="mono">↵</span> run</span>
      <span><span class="mono">⇥</span> show options</span>
      <span><span class="mono">esc</span> close</span>
      <span style="margin-left: auto">Type <span class="mono">&gt;</span> to run a raw git command</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
